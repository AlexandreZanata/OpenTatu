# CI runs exactly what developers and agents run locally: `cargo xtask check`.
# The toolchain comes from rust-toolchain.toml (rustup installs it on first use).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
